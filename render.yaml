services:
  - type: web
    name: scopeguard-demo
    runtime: python
    plan: free
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && python -m pip install --upgrade pip && python -m pip install .
    startCommand: scopeguard --home /tmp/scopeguard-demo serve --demo --reset --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENABLE_HEARTBEAT
        value: "false"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeguard"
version = "1.0.0"
description = "Commitment underwriting for B2B sales promises, with humans and agents working a Switch room."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Scope Guard" }]
keywords = ["switch", "agents", "sales", "governance", "receipts", "approvals"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "websockets>=13",
  "cryptography>=43",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx2>=2,<3",
]

[project.scripts]
scopeguard = "scopeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scopeguard = [
  "api/static/*.css",
  "api/static/*.svg",
  "api/static/app/*",
  "api/static/app/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:scopeguard.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",
  # The domain enums intentionally inherit ``str`` so they serialize as plain
  # strings in receipts. ``StrEnum`` would change ``str(enum)`` behaviour.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# FastAPI's dependency injection is expressed in argument defaults; that is
# the framework's documented pattern, not a mutable-default bug.
"src/scopeguard/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/scopeguard"]

[tool.coverage.run]
source = ["scopeguard"]

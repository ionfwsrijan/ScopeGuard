<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Scope Guard{% endblock %}</title>
  <meta name="description" content="Scope Guard turns client scope creep into priced, challenged, human-signed change orders.">
  <link rel="icon" href="/static/shield.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/scopeguard.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="/" aria-label="Scope Guard home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 36" width="26" height="30"><path d="M16 1.5 29 6v11.2c0 8.2-5.4 14.4-13 17.3C8.4 31.6 3 25.4 3 17.2V6L16 1.5Z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m9.5 17.4 4.2 4.2 8.8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-word">Scope Guard</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="/">Ledger</a>
        <a href="/verify">Verify</a>
        <a href="/api/health">API</a>
        <span class="version">v{{ version }}</span>
      </nav>
    </div>
  </header>

  <main id="main" class="shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="shell footer-inner">
      <div>
        <span class="brand-word small">Scope Guard</span>
        <span class="muted">Every 'one more thing' gets a price.</span>
      </div>
      <div class="muted">
        Deterministic pricing · independent Red Team · human signatures · two-party change orders ·
        <a href="https://switchagents.ai" rel="noreferrer">built for Switch</a>
      </div>
    </div>
  </footer>
</body>
</html>
